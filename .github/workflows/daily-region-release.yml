name: Daily release of 5 regional pages
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: daily-region-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare next five pages or resume an unfinished batch
        id: prepare
        run: python .github/scripts/release_daily.py prepare
      - name: Save publication state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 지역 sitemap.xml .release-plan.json .daily-release.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish daily regional batch (maximum 5)'
            git push origin HEAD:main
          fi
      - name: Request Pages build explicitly for bot commits
        if: steps.prepare.outputs.pending == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Verify live pages and submit IndexNow
        if: steps.prepare.outputs.pending == 'true'
        run: python .github/scripts/release_daily.py notify
      - name: Save successful receipt
        if: steps.prepare.outputs.pending == 'true'
        run: |
          git add .daily-release.json
          git commit -m 'Record live deployment and IndexNow receipt'
          git push origin HEAD:main
      - name: Run summary
        if: always()
        run: |
          echo '### Regional publication state' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .daily-release.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
